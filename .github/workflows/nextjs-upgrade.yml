name: Next.js production validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: nextjs-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
      - name: Install reproducible dependencies
        run: npm ci
      - name: Build production application
        run: npm run build
      - name: Smoke test production server
        run: npm run test:smoke
      - name: Test Resend SDK contract without sending email
        run: node scripts/contact-sdk-test.mjs
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=low
